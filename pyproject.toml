[tool.poetry]
name = "graffitihouse"
version = "0.1.0"
description = "Web application for Graffiti House"
authors = ["Jason Heppler <jason.heppler@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = "^5.2.10"
django-extensions = "^4.1"
Pillow = "^12.1.0"
django-tailwind = "^4.4.2"
django-browser-reload = "^1.21.0"
psycopg2 = "^2.9.11"
python-dotenv = "^1.2.1"
django-environ = "^0.12.0"
django-prose = "^2.1.0"
django-admin-interface = "^0.32.0"
django-multiselectfield = "^1.0.1"
django-debug-toolbar = "^6.2.0"
django-import-export = "^4.4.0"
geopy = "^2.4.1"
django-dbml = "^0.10.1"
django-taggit = "^6.1.0"
taggit-selectize = "^2.11.0"
django-leaflet = "^0.33.0"
django-simple-history = "^3.11.0"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
djhtml = "^3.0.10"
pre-commit = "^4.5.1"
pytest-sugar = "^1.1.1"
pytest-django = "^4.11.1"
pylint-django = "^2.7.0"
django-extensions = "^4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
